[project]
name = "edgar-rag"
version = "0.1.0"
description = "Local RAG assistant over SEC 10-K filings, powered by Ollama and Chroma"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "chromadb>=0.5",
    "httpx>=0.27",
    "lxml>=5.0",
    "ollama>=0.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "streamlit>=1.38",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/sparkk29/edgar-rag-ollama"
Repository = "https://github.com/sparkk29/edgar-rag-ollama"
Issues = "https://github.com/sparkk29/edgar-rag-ollama/issues"

[project.scripts]
edgar-rag = "edgar_rag.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
